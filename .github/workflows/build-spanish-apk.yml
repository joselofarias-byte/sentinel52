name: Build Spanish APK

on:
  push:
    branches:
      - build/spanish-apk-20260925

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV

      - name: Install SDK components
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMAN=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMAN" ]; then SDKMAN="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMAN" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          ls -lh "$APK"
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/Sentinel52-es-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel52-spanish-apk
          path: artifacts/Sentinel52-es-v0.1.0.apk
          if-no-files-found: error
